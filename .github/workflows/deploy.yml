name: Deploy Andromeda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, andromeda]

    steps:
      - name: Deploy
        run: |
          cd /opt/andromeda-go
          git fetch origin
          git reset --hard origin/main
          docker compose up -d --build
          docker image prune -f

